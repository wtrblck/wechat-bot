account:
  key: personal-wechat
  selfId: REPLACE_LOCALLY
  bridgeEpoch: source-1
bridge:
  sessionFile: ../weixin-research/runs/bridge/session.json
  pollMs: 1000
  requestStoreContinuity: manual
access:
  owners: []
  prefix: '/ai '
  direct:
    allow: []
    trigger: all
  group:
    allow: []
    trigger: autonomous
codex:
  enabled: false
  executable: codex
  home: data/codex-home
  timeoutSeconds: 1800
  maxConcurrent: 1
  maxQueued: 10
participation:
  debounceMs: 500
  maxBatchWaitMs: 2000
  cooldownSeconds: 2
  maxRepliesPerMinute: 8
runtime:
  engine: dsh
  provider: REPLACE_WITH_CONFIGURED_PROVIDER
  model: REPLACE_WITH_CONFIGURED_MODEL
  preset: assistant
  turnTimeoutSeconds: 600
  chatContextBytes: 196608
memory:
  enabled: true
  retrieval:
    pageSize: 3
    maxSegments: 12
    historyBatchSize: 20
    maxHistoryBatches: 4
    timeoutMs: 15000
    maxBytes: 32768
    maxTokens: 8000
sessions:
  isolation: conversation
  crossSessionMemory: false
  fallbackContextTokens: 65536
  rolloverRatio: 0.8
  reserveTokens: 8192
  recentMessages: 12
  maxSummaryChars: 6000
  summaryMaxAttempts: 4
social:
  enabled: true
  toneMinutes: 30
  careCooldownHours: 24
  proactive:
    enabled: false
    contacts: []
    maxPerContactPerDay: 1
    minIdleMinutes: 30
    quietStartHour: 22
    quietEndHour: 9
prompts:
  profile: default
promptProfiles:
  default:
    persona: prompts/personas/default.md
conversationOverrides:
  groups: {}
  contacts: {}
media:
  enabled: true
  maxImagesPerReply: 6
sandbox:
  directory: data/sandbox
video:
  enabled: true
  python: py
  maxInputMiB: 128
  maxDurationSeconds: 3600
  timeoutSeconds: 90
  frames: 12
  bilibili: true
  douyin: true
  bilibiliCookies: config/bilibili.cookies.local.txt
  douyinCookies: config/douyin.cookies.local.txt
  asr:
    backend: local
    localModel: data/video-models/faster-whisper-base
    maxSeconds: 180
stickers:
  enabled: true
  directory: data/stickers
  maxFiles: 512
  maxFileMiB: 10
egress:
  sendArtifacts: true
externalAccess:
  enabled: false
  timeoutSeconds: 120
  maxFileMiB: 10
# To enable externalAccess, set approver to an existing allowed private contact.
web:
  fetch: true
  search: true
budget:
  enabled: true
  dailyLimitCny: 5
  timeZone: Asia/Shanghai
  resumeAtMidnight: true
  pricingFile: config/pricing.deepseek.2026-10-29.json
  maxPricingAgeDays: 30
