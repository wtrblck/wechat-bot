name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pnpm and agent dependencies
        working-directory: agent
        run: |
          npm install -g pnpm@11.22.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Agent and first-run setup tests
        working-directory: agent
        run: pnpm test
      - name: Install Python dependencies
        run: python -m pip install --target weixin-research/deps -r weixin-research/requirements.txt
      - name: Bridge unit tests
        run: python -m unittest discover -s weixin-research/tests -p "test_*.py"
